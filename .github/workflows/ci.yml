name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rule tests, plus the migrations and row-level security in a real Postgres engine.
      - run: npm test
      # The generated seed files must match the authored content.
      - run: npm run seed && git diff --exit-code -- supabase/seed.sql app/seed/seed.json
